<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Favicon/Favicon1.svg" type="image/svg+xml">
    <title>Tecboard</title>
    <link rel="stylesheet" href="CSS/style.css">
    <meta name="google-site-verification" content="GHTHp2vx-U67-WHCzUp-U7tKPFvbgK9O4-5lHbPYTk4" />
</head>

<body>
    <!-- Corpo do documento: contém todo o conteúdo visível da página -->

    <header>
        <!-- Elemento semântico que representa o cabeçalho visual da página (topo do site) -->

        <img src="Img/logo.png" alt="logo da cor preta, da empresa Tecboard">
        <!-- Exibe a logo da empresa; o atributo alt descreve a imagem para acessibilidade e SEO -->

    </header>

    <main>
        <!-- Elemento semântico que representa o conteúdo principal da página -->

        <section>
            <!-- Agrupa um bloco de conteúdo relacionado (nesse caso, a seção principal/hero) -->

            <h1>
                <span>Fique de olho</span>
                <!-- span usado para poder estilizar separadamente essa parte do título (ex: cor diferente) -->
                <br>
                <!-- Quebra de linha, forçando "no que importa" a ficar na linha de baixo -->
                no que importa
            </h1>
            <!-- Título principal da página (mais importante para SEO e para o usuário) -->

            <p>Monitoramento em tempo real com alertas inteligentes para sua aplicação nunca sair do ar sem você saber.</p>
            <!-- Parágrafo de descrição/subtítulo explicando o serviço oferecido -->

            <a href="#">Testar versão demo</a>
            <!-- Link/botão de chamada para ação (CTA); o href="#" é um link temporário, sem destino definido ainda -->

            <img src="Img/Celures-expostos.png" alt="Dois Celures pretos sobrepostos, com uma sombra preta sob eles">
            <!-- Imagem ilustrativa do produto/celulares; alt descreve a imagem para acessibilidade -->

        </section>
    </main>

</body>
</html>
